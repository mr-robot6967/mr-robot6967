name: languages
on:
  schedule:
    - cron: "40 0 * * *" # just after midnight UTC
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    paths: [".github/workflows/languages.yml", ".github/scripts/languages.py", ".github/scripts/publish.sh"]
permissions:
  contents: write # needed to commit the picture
concurrency:
  group: languages
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the languages card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/languages.py mr-robot6967 languages/languages.svg
      - name: Publish to the output branch
        run: bash .github/scripts/publish.sh languages
