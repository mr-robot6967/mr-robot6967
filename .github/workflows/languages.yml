name: languages
on:
  schedule:
    - cron: "40 0 * * *" # just after midnight UTC
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    paths: [".github/workflows/languages.yml", ".github/scripts/languages.py"]
permissions:
  contents: write # needed to commit the picture
concurrency:
  group: languages
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the languages card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/languages.py krishnaakshath languages/languages.svg
      - name: Commit the picture if it changed
        run: |
          git add languages
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update languages"
          git push
