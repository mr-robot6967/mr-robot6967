name: koi
on:
  schedule:
    - cron: "20 0 * * *" # just after midnight UTC
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    paths: [".github/workflows/koi.yml", ".github/scripts/publish.sh"]
permissions:
  contents: write # needed to commit the picture
concurrency:
  group: koi
jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@v1.0.2 # pinned to a release, so an update can't change what runs here
        with:
          body: white
          output-dir: koi
      - name: Publish to the output branch
        run: bash .github/scripts/publish.sh koi
